project:
  name: token-tax-indic
  seed: 42
  output_dir: results
  run_name: local-baseline
dataset:
  name: Muennighoff/flores200
  split: dev
  languages:
    eng_Latn: English
    hin_Deva: Hindi
    kan_Knda: Kannada
    tam_Taml: Tamil
    tel_Telu: Telugu
  max_parallel_rows: 300
  streaming: true
normalization:
  forms: [none, NFC]
tokenizers:
  candidates:
    - id: gpt2
      label: GPT-2 BPE
      model_id: gpt2
      revision: main
    - id: mbert
      label: mBERT WordPiece
      model_id: bert-base-multilingual-cased
      revision: main
    - id: xlm-roberta
      label: XLM-R SentencePiece
      model_id: xlm-roberta-base
      revision: main
    - id: qwen2.5-0.5b
      label: Qwen 2.5 0.5B tokenizer
      model_id: Qwen/Qwen2.5-0.5B
      revision: main
    - id: indicbertv2
      label: IndicBERTv2 tokenizer
      model_id: ai4bharat/IndicBERTv2-MLM-only
      revision: main
benchmark:
  warmup_runs: 3
  timed_runs: 20
  batch_sizes: [1, 2, 4]
  max_sequence_lengths: [128, 256, 512]
  synchronize_cuda: true
  context_window: 8192
