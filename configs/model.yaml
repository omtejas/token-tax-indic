# Set a model only after checking access, licence, architecture and tokenizer compatibility.
model:
  model_id: distilbert/distilgpt2
  revision: main
  task: causal-lm
  torch_dtype: float16
  device: auto
  trust_remote_code: false
  load_in_4bit: false
  max_new_tokens: 1
  max_input_tokens: 512
  batch_size: 1
  enabled: false
notes:
  - This default is a small smoke-test candidate, not a finalized scientific model.
  - Do not substitute a tokenizer from another model family.
  - Keep 1 GB or more of VRAM headroom where possible.
